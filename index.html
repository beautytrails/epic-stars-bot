<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarBuy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    .neon { box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); }
    .tab-active { border-bottom: 3px solid #eab308; color: #eab308; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Приветствие -->
  <div class="px-5 pt-8 pb-4">
    <h1 class="text-2xl font-bold text-center">Привет, certified genome carrier &gt;_!</h1>
  </div>

  <!-- Розыгрыши -->
  <div class="mx-5 glass rounded-3xl p-5 flex items-center gap-4">
    <div>
      <div class="text-xl font-semibold">Розыгрыши</div>
      <div class="text-sm text-gray-400">Ежедневные розыгрыши в нашем канале!</div>
    </div>
    <div class="ml-auto text-7xl">🦆</div>
  </div>

  <!-- Табы -->
  <div class="flex justify-center gap-10 border-b border-gray-800 mt-8 px-6 text-lg">
    <button onclick="switchTab(0)" class="tab-active pb-3 px-6" id="tab-0">Stars</button>
    <button onclick="switchTab(1)" class="pb-3 px-6" id="tab-1">Premium</button>
    <button onclick="switchTab(2)" class="pb-3 px-6" id="tab-2">Ton</button>
  </div>

  <!-- STARS TAB -->
  <div id="content-0" class="p-5">
    <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
    <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
      <input id="username" type="text" value="@triplesixxf" class="bg-transparent outline-none flex-1 text-lg">
      <div class="text-4xl">👤</div>
    </div>

    <div class="text-center text-sm text-gray-400 mt-8">Введите количество звезд</div>

    <div class="grid grid-cols-3 gap-3 mt-6">
      <button onclick="selectStars(50)" class="glass rounded-3xl py-6 text-center text-2xl">50 ⭐</button>
      <button onclick="selectStars(100)" class="glass rounded-3xl py-6 text-center text-2xl">100 ⭐</button>
      <button onclick="selectStars(500)" class="glass rounded-3xl py-6 text-center text-2xl">500 ⭐</button>
      <button onclick="selectStars(1000)" class="glass rounded-3xl py-6 text-center text-2xl">1000 ⭐</button>
      <button onclick="selectStars(5000)" class="glass rounded-3xl py-6 text-center text-2xl">5000 ⭐</button>
      <button onclick="selectStars(3000)" class="glass rounded-3xl py-6 text-center text-2xl">3000 ⭐</button>
    </div>

    <button onclick="buyStars()" class="w-full mt-10 py-6 bg-yellow-400 hover:bg-yellow-300 text-black font-bold text-2xl rounded-3xl neon">
      Купить
    </button>
  </div>

  <!-- PREMIUM TAB -->
  <div id="content-1" class="p-5 hidden">
    <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
    <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
      <input id="premium-username" type="text" value="@triplesixxf" class="bg-transparent outline-none flex-1 text-lg">
      <div class="text-4xl">👤</div>
    </div>

    <div class="text-center text-sm text-gray-400 mt-8">Выберите количество месяцев</div>
    <div class="grid grid-cols-3 gap-4 mt-6">
      <button onclick="selectPremium(3)" class="glass rounded-3xl py-8 text-center">
        <div class="text-4xl">3</div>
        <div class="text-yellow-400 text-xl">1 120 ₽</div>
      </button>
      <button onclick="selectPremium(6)" class="glass rounded-3xl py-8 text-center">
        <div class="text-4xl">6</div>
        <div class="text-yellow-400 text-xl">1 490 ₽</div>
      </button>
      <button onclick="selectPremium(12)" class="glass rounded-3xl py-8 text-center">
        <div class="text-4xl">12</div>
        <div class="text-yellow-400 text-xl">2 700 ₽</div>
      </button>
    </div>
  </div>

  <!-- TON TAB -->
  <div id="content-2" class="p-5 hidden text-center text-gray-400 py-20">
    Скоро здесь будет покупка TON
  </div>

  <!-- Нижняя навигация -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-gray-800 py-3">
    <div class="flex justify-around text-xs">
      <div class="text-center"><i class="fa-solid fa-gift text-3xl"></i><br>Розыгрыши</div>
      <div onclick="switchTab(0)" class="text-center text-yellow-400"><i class="fa-solid fa-star text-3xl"></i><br>Звёзды</div>
      <div class="text-center"><i class="fa-solid fa-user text-3xl"></i><br>Профиль</div>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    function switchTab(n) {
      document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('content-' + n).classList.remove('hidden');
      
      document.querySelectorAll('button[id^="tab-"]').forEach(el => el.classList.remove('tab-active'));
      document.getElementById('tab-' + n).classList.add('tab-active');
    }

    function selectStars(count) {
      Telegram.WebApp.showAlert(`Выбрано ${count} звёзд`);
    }

    function selectPremium(months) {
      Telegram.WebApp.showAlert(`Выбран Premium на ${months} месяцев`);
    }

    function buyStars() {
      const username = document.getElementById('username').value || '@user';
      Telegram.WebApp.showAlert(`Заказ на звёзды для ${username} создан!`);
    }

    // Автоматически открываем вкладку Stars
    switchTab(0);
  </script>
</body>
</html>
