<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarBuy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    .neon-yellow { box-shadow: 0 0 20px rgba(234, 179, 8, 0.7); }
  </style>
</head>
<body class="min-h-screen pb-20">

  <div class="p-5">
    <h1 class="text-2xl font-bold text-center mb-2">Привет, certified genome carrier &gt;_!</h1>

    <!-- Розыгрыши -->
    <div class="glass rounded-3xl p-4 flex items-center gap-4 mt-6">
      <div>
        <div class="text-lg font-semibold">Розыгрыши</div>
        <div class="text-sm text-gray-400">Ежедневные розыгрыши в нашем канале!</div>
      </div>
      <div class="ml-auto text-6xl">🦆</div>
    </div>

    <!-- Табы -->
    <div class="flex justify-center gap-8 border-b border-gray-800 mt-8 text-lg">
      <button onclick="switchTab(0)" class="tab-active pb-3 px-8" id="tab-0">Stars</button>
      <button onclick="switchTab(1)" class="pb-3 px-8" id="tab-1">Premium</button>
      <button onclick="switchTab(2)" class="pb-3 px-8" id="tab-2">Ton</button>
    </div>

    <!-- Stars Tab -->
    <div id="content-0">
      <div class="mt-6">
        <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
        <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
          <input id="username" type="text" class="bg-transparent outline-none flex-1 text-lg" value="@triplesixxf">
          <div class="text-4xl">👤</div>
        </div>
      </div>

      <div class="text-center text-sm text-gray-400 mt-8">Введите количество звезд</div>

      <div class="glass rounded-3xl p-6 mt-4 text-center">
        <div class="flex justify-center items-center gap-8 text-5xl">
          <div>50 <span class="text-yellow-400">★</span></div>
          <div class="text-4xl text-gray-500">⇄</div>
          <div class="text-yellow-400">70₽</div>
        </div>
      </div>

      <div class="grid grid-cols-5 gap-3 mt-8">
        <button onclick="selectAmount(50)" class="glass rounded-3xl py-5 text-lg">50</button>
        <button onclick="selectAmount(150)" class="glass rounded-3xl py-5 text-lg">150</button>
        <button onclick="selectAmount(250)" class="glass rounded-3xl py-5 text-lg">250</button>
        <button onclick="selectAmount(500)" class="glass rounded-3xl py-5 text-lg">500</button>
        <button onclick="selectAmount(1500)" class="glass rounded-3xl py-5 text-lg">1500</button>
      </div>

      <button onclick="buyStars()" class="w-full mt-10 py-6 bg-yellow-400 text-black font-bold text-2xl rounded-3xl neon-yellow">
        Купить
      </button>
    </div>

    <!-- Premium Tab -->
    <div id="content-1" class="hidden">
      <div class="mt-6 text-center">
        <div class="text-sm text-gray-400">Выберите количество месяцев</div>
        <div class="grid grid-cols-3 gap-4 mt-6">
          <button onclick="selectPremium(3)" class="glass rounded-3xl py-8">
            <div class="text-3xl">3</div>
            <div class="text-yellow-400">1 120 ₽</div>
          </button>
          <button onclick="selectPremium(6)" class="glass rounded-3xl py-8">
            <div class="text-3xl">6</div>
            <div class="text-yellow-400">1 490 ₽</div>
          </button>
          <button onclick="selectPremium(12)" class="glass rounded-3xl py-8">
            <div class="text-3xl">12</div>
            <div class="text-yellow-400">2 700 ₽</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Ton Tab -->
    <div id="content-2" class="hidden p-8 text-center text-gray-400">
      Скоро здесь будет покупка TON
    </div>
  </div>

  <!-- Нижняя панель -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-gray-800 py-4">
    <div class="flex justify-around text-xs">
      <div class="text-center"><i class="fa-solid fa-gift text-3xl"></i><br>Розыгрыши</div>
      <div class="text-center text-yellow-400"><i class="fa-solid fa-star text-3xl"></i><br>Звёзды</div>
      <div class="text-center"><i class="fa-solid fa-user text-3xl"></i><br>Профиль</div>
    </div>
  </div>

  <script>
    function switchTab(n) {
      document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('content-' + n).classList.remove('hidden');
    }

    function selectAmount(count) {
      alert(`Выбрано ${count} звёзд`);
    }

    function selectPremium(months) {
      alert(`Выбран Premium на ${months} месяцев`);
    }

    function buyStars() {
      const username = document.getElementById('username').value;
      Telegram.WebApp.showAlert(`Заказ на звёзды для ${username} создан!`);
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>
