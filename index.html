<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarBuy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); }
    .neon-rub { box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); }
    .tab-active { border-bottom: 3px solid #eab308; color: #eab308; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Приветствие -->
  <div class="px-5 pt-8 pb-2 text-center">
    <h1 id="greeting" class="text-2xl font-bold"></h1>
  </div>

  <!-- Надёжность -->
  <div class="mx-5 glass rounded-3xl p-5 flex items-center gap-4">
    <div>
      <div class="text-xl font-semibold">Надёжность</div>
      <div class="text-sm text-gray-400">5000+ отзывов говорят сами за себя :)</div>
    </div>
    <div class="ml-auto text-7xl">🦆</div>
  </div>

  <!-- Табы -->
  <div class="flex justify-center gap-10 border-b border-gray-800 mt-8 px-6 text-lg">
    <button onclick="switchTab(0)" class="tab-active pb-3 px-6" id="tab-0">Stars</button>
    <button onclick="switchTab(1)" class="pb-3 px-6" id="tab-1">Premium</button>
    <button onclick="switchTab(2)" class="pb-3 px-6" id="tab-2">Ton</button>
  </div>

  <!-- STARS TAB -->
  <div id="content-0" class="p-5">
    <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
    <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
      <input id="username" type="text" class="bg-transparent outline-none flex-1 text-lg" placeholder="@username">
      <div id="avatar" class="w-11 h-11 rounded-2xl overflow-hidden bg-gray-700 flex-shrink-0"></div>
    </div>

    <div class="text-sm text-gray-400 mt-8 mb-3">Введите количество звезд</div>

    <div class="glass rounded-3xl p-5 flex justify-between items-center text-4xl">
      <div>50 <span class="text-yellow-400">★</span></div>
      <div id="price-display" class="text-yellow-400">70₽</div>
    </div>

    <div class="flex gap-2 mt-6 overflow-x-auto pb-2">
      <button onclick="selectStars(50)" class="glass px-5 py-3 rounded-3xl text-sm">50</button>
      <button onclick="selectStars(150)" class="glass px-5 py-3 rounded-3xl text-sm">150</button>
      <button onclick="selectStars(250)" class="glass px-5 py-3 rounded-3xl text-sm">250</button>
      <button onclick="selectStars(500)" class="glass px-5 py-3 rounded-3xl text-sm">500</button>
      <button onclick="selectStars(1500)" class="glass px-5 py-3 rounded-3xl text-sm">1500</button>
    </div>

    <!-- Выбор оплаты -->
    <div class="mt-8 flex gap-3">
      <button class="flex-1 glass rounded-3xl py-4 flex items-center justify-center gap-2 text-blue-400">
        <span class="text-2xl">💎</span> Ton
      </button>
      <button onclick="selectRub()" class="flex-1 glass rounded-3xl py-4 flex items-center justify-center gap-2 neon-rub border border-yellow-400 text-white">
        <span class="text-xl">▶️</span> Rub
      </button>
    </div>

    <button onclick="paySBP()" class="w-full mt-4 glass rounded-3xl py-5 text-lg font-medium">
      Оплата через СБП
    </button>
  </div>

  <!-- PREMIUM TAB -->
  <div id="content-1" class="p-5 hidden">
    <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
    <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
      <input id="premium-username" type="text" class="bg-transparent outline-none flex-1 text-lg" placeholder="@username">
      <div id="premium-avatar" class="w-11 h-11 rounded-2xl overflow-hidden bg-gray-700"></div>
    </div>

    <div class="text-sm text-gray-400 mt-8 mb-3">Выберите количество месяцев</div>
    <div class="grid grid-cols-3 gap-4">
      <button onclick="selectPremium(3)" class="glass rounded-3xl py-7 text-center">
        <div class="text-3xl">3</div>
        <div class="text-yellow-400">1 120 ₽</div>
      </button>
      <button onclick="selectPremium(6)" class="glass rounded-3xl py-7 text-center">
        <div class="text-3xl">6</div>
        <div class="text-yellow-400">1 490 ₽</div>
      </button>
      <button onclick="selectPremium(12)" class="glass rounded-3xl py-7 text-center">
        <div class="text-3xl">12</div>
        <div class="text-yellow-400">2 700 ₽</div>
      </button>
    </div>
  </div>

  <!-- TON TAB -->
  <div id="content-2" class="p-5 hidden text-center text-gray-400 py-20">
    Скоро здесь будет покупка TON
  </div>

  <!-- Нижняя навигация -->
  <div class="fixed bottom-0 left-0 right-0 glass py-3 border-t border-gray-800">
    <div class="flex justify-around text-xs">
      <button class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-gift text-3xl"></i>
        <span class="mt-1">Розыгрыши</span>
      </button>
      <button onclick="switchTab(0)" class="flex flex-col items-center text-yellow-400">
        <i class="fa-solid fa-star text-3xl"></i>
        <span class="mt-1">Звёзды</span>
      </button>
      <button class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-user text-3xl"></i>
        <span class="mt-1">Профиль</span>
      </button>
    </div>
  </div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Приветствие
    const user = tg.initDataUnsafe?.user || {};
    const name = user.first_name || user.username || "emotional swaggage";
    document.getElementById('greeting').textContent = `Привет, ${name}!`;

    let currentStars = 50;

    function switchTab(n) {
      document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('content-' + n).classList.remove('hidden');
    }

    function selectStars(count) {
      currentStars = count;
      const price = Math.round(count * 1.4);
      document.getElementById('price-display').innerHTML = `
        ${count} <span class="text-yellow-400">★</span> <span class="text-yellow-400">${price}₽</span>
      `;
    }

    function selectPremium(months) {
      tg.showAlert(`Выбран Premium на ${months} месяцев`);
    }

    function selectRub() {
      tg.showAlert('Выбрана оплата в RUB');
    }

    function paySBP() {
      tg.showAlert('Открываем оплату через СБП...');
    }

    // Запуск
    switchTab(0);
  </script>
</body>
</html>
