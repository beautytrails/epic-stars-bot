<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarBuy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui; }
    .glass { 
      background: rgba(255,255,255,0.08); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(255,255,255,0.12); 
    }
    .big-glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Приветствие -->
  <div class="px-5 pt-8 text-center">
    <h1 id="greeting" class="text-2xl font-bold">Привет, emotional swaggage!</h1>
  </div>

  <!-- Надёжность -->
  <div class="mx-5 mt-4 glass rounded-3xl p-5 flex items-center gap-4">
    <div>
      <div class="text-xl font-semibold">Надёжность</div>
      <div class="text-sm text-gray-400">5000+ отзывов говорят сами за себя :)</div>
    </div>
    <div class="ml-auto text-7xl">🦆</div>
  </div>

  <!-- Табы -->
  <div class="flex justify-center gap-10 border-b border-gray-800 mt-8 px-6 text-lg">
    <button onclick="switchTab(0)" class="tab-active pb-3 px-6" id="tab-0">Stars</button>
    <button onclick="switchTab(1)" class="pb-3 px-6" id="tab-1">Premium</button>
    <button onclick="switchTab(2)" class="pb-3 px-6" id="tab-2">Ton</button>
  </div>

  <!-- STARS TAB -->
  <div id="content-0" class="p-5">
    <div class="text-sm text-gray-400 mb-2">Введите юзернейм</div>
    <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3">
      <input id="username" type="text" class="bg-transparent outline-none flex-1 text-lg" value="@fdskjifdjifjsjoifoiioi">
      <div id="avatar" class="w-11 h-11 rounded-2xl overflow-hidden bg-gray-700"></div>
    </div>

    <div class="text-sm text-gray-400 mt-8 mb-2">Введите количество звезд</div>

    <!-- Большой стеклянный блок как на скрине -->
    <div class="big-glass rounded-3xl p-5 flex justify-between items-center text-4xl">
      <div>50 <span class="text-yellow-400">★</span></div>
      <div class="text-3xl text-gray-400">⇄</div>
      <div class="text-yellow-400">70₽</div>
    </div>

    <!-- Маленькие круглые кнопки -->
    <div class="flex gap-2 mt-6 overflow-x-auto pb-2">
      <button onclick="selectStars(50)" class="glass px-6 py-3 rounded-3xl text-sm whitespace-nowrap">50</button>
      <button onclick="selectStars(150)" class="glass px-6 py-3 rounded-3xl text-sm whitespace-nowrap">150</button>
      <button onclick="selectStars(250)" class="glass px-6 py-3 rounded-3xl text-sm whitespace-nowrap">250</button>
      <button onclick="selectStars(500)" class="glass px-6 py-3 rounded-3xl text-sm whitespace-nowrap">500</button>
      <button onclick="selectStars(1500)" class="glass px-6 py-3 rounded-3xl text-sm whitespace-nowrap">1500</button>
    </div>

    <!-- Оплата -->
    <div class="mt-8 flex gap-3">
      <button class="flex-1 glass rounded-3xl py-4 flex items-center justify-center gap-2">
        <span class="text-blue-400 text-2xl">💎</span> Ton
      </button>
      <button onclick="selectRub()" class="flex-1 glass rounded-3xl py-4 flex items-center justify-center gap-2 neon-rub border border-yellow-400">
        <span class="text-xl">▶️</span> Rub
      </button>
    </div>

    <button onclick="paySBP()" class="w-full mt-4 glass rounded-3xl py-5 text-lg font-medium">
      Оплата через СБП
    </button>
  </div>

  <!-- Остальные табы (Premium и Ton) оставляем как были -->
  <div id="content-1" class="p-5 hidden">...</div>
  <div id="content-2" class="p-5 hidden">...</div>

  <!-- Нижняя навигация -->
  <div class="fixed bottom-0 left-0 right-0 glass py-3 border-t border-gray-800">
    <div class="flex justify-around text-xs">
      <button class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-gift text-3xl"></i>
        <span class="mt-1">Розыгрыши</span>
      </button>
      <button onclick="switchTab(0)" class="flex flex-col items-center text-yellow-400">
        <i class="fa-solid fa-star text-3xl"></i>
        <span class="mt-1">Звёзды</span>
      </button>
      <button class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-user text-3xl"></i>
        <span class="mt-1">Профиль</span>
      </button>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const user = Telegram.WebApp.initDataUnsafe?.user || {};
    const name = user.first_name || user.username || "emotional swaggage";
    document.getElementById('greeting').textContent = `Привет, ${name}!`;

    function switchTab(n) {
      document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('content-' + n).classList.remove('hidden');
    }

    function selectStars(count) {
      Telegram.WebApp.showAlert(`Выбрано ${count} звёзд`);
    }

    function selectRub() {
      Telegram.WebApp.showAlert('Выбрана оплата RUB');
    }

    function paySBP() {
      Telegram.WebApp.showAlert('Открываем оплату через СБП...');
    }

    switchTab(0);
  </script>
</body>
</html>
